# Tests, package build and install test on every pull request and every push to main.
# Read-only token, no secrets, actions pinned to full commit SHAs.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pytest ruff mypy jsonschema
      - run: make verify-fast PY=python
      - run: mypy --strict runtime/gi_ai

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: python3 -m pip install pytest
      - run: make deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: deb, path: dist/*.deb, retention-days: 7 }

  install-matrix:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        # amd64 only. Images pinned by digest.
        include:
          - { name: ubuntu-24.04, image: "ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60" }
          - { name: ubuntu-26.04, image: "ubuntu:26.04@sha256:3595d7fc4286a33fad0fd853a4063e654287a9c3787437d7937c94ca3f7a804e" }
          - { name: debian-12, image: "debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26" }
          - { name: debian-13, image: "debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c" }
          - { name: mint-22.3, image: "linuxmintd/mint22.3-amd64@sha256:304bbf7ec2a61252962c5210467d231a141661490e8962f52fd4df7688370369" }
    name: install-matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: deb, path: dist }
      - run: bash tests/install/install_smoke.sh "$(ls "$PWD"/dist/gi-ai_*_all.deb)"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: python3 -m pip install zizmor actionlint-py
      - run: actionlint
      - run: zizmor --min-severity medium .github/workflows
